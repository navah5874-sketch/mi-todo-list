<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>lista de tareas</title>
</head>

<body>
    <header>
        <h1>Mi lista de tareas</h1>
    </header>

    <main>
        <form id="form-tarea">
            <input type="text" id="input-tarea" placeholder="Escribe una tarea...">
            <button type="submit">Agregar</button>
        </form>

        <ul id="form-tarea">
            <li class="Tareas">
                <span class="texto">Tarea Ejemplo</span>
                <button class="Eliminar">x</button>

            </li>
        </ul>

        <p id="contador-tareas">1 tarea</p>

    </main>

    <footer>
        <p>&copy; 2026 la mejor lista de tareas del mundo.</p>
    </footer>

</body>

</html>
